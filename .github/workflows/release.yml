name: release

# Builds the server and client MSIs on tag push and attaches them to a GitHub Release.
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# ...then watch the Actions tab; when green, the Release page has:
#   OpenPrintDeploy.Server.msi           <- install on the print server
#   OpenPrintDeploy.Client.msi           <- install on client devices

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # required to create the Release + upload assets

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve release version from tag
        id: ver
        shell: powershell
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          echo "version=$v" >> $env:GITHUB_OUTPUT
          $notesPath = "docs/releases/$v.md"
          if (Test-Path -LiteralPath $notesPath) {
            echo "notes=$notesPath" >> $env:GITHUB_OUTPUT
          }

      - name: Build + test
        run: dotnet test OpenPrintDeploy.sln -c Release -p:NuGetAudit=true --nologo

      - name: Build server MSI
        run: .\scripts\Publish-Server.ps1 -Version "${{ steps.ver.outputs.version }}"
        shell: powershell

      - name: Create Release + upload assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            publish/OpenPrintDeploy.Server.msi
            publish/OpenPrintDeploy.Client.msi
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          body_path: ${{ steps.ver.outputs.notes }}
          generate_release_notes: true
